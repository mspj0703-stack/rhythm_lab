name: Build BEATDASH Windows Desktop

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'desktop/**'
      - 'web/VERSION'
      - 'web/SERVICE_URL'
      - '.github/workflows/build-desktop-windows.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Desktop dependencies
        working-directory: desktop
        run: npm install
      - name: Build Windows Desktop
        working-directory: desktop
        run: npm run build
      - name: Verify bundle version source
        shell: pwsh
        run: |
          $expected = (Get-Content web/VERSION -Raw).Trim()
          $cfg = Get-Content desktop/src-tauri/tauri.version.conf.json -Raw | ConvertFrom-Json
          if ($cfg.version -ne $expected) { throw "Desktop version $($cfg.version) != web/VERSION $expected" }
          Write-Host "Desktop version: $expected"
      - name: Verify executable
        shell: pwsh
        run: |
          $exe = 'desktop/src-tauri/target/release/beatdash-desktop.exe'
          if (!(Test-Path $exe)) { throw "Missing $exe" }
          Get-Item $exe | Format-List Name,Length,LastWriteTime
      - uses: actions/upload-artifact@v4
        with:
          name: beatdash-windows-desktop
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/beatdash-desktop.exe
            desktop/src-tauri/target/release/bundle/nsis/*.exe
