name: Verify monorepo container
on:
  workflow_dispatch:
  pull_request:
    paths: ['web/**', 'Dockerfile', '.dockerignore', 'railway.json', 'scripts/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/verify_container.sh
