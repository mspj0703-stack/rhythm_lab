name: Deploy Railway Production

on:
  push:
    branches: [railway-prod]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: railway-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/railway-prod'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Load release version
        id: release
        shell: bash
        run: |
          version="$(tr -d '\r\n' < web/VERSION)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Expected version: $version"
      - name: Stamp deployment revision
        run: printf '%s\n' "$GITHUB_SHA" > web/BUILD_REVISION
      - name: Verify root Dockerfile before deployment
        run: bash scripts/verify_container.sh
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy to Railway
        run: >-
          railway up
          --project 79af9830-4a88-4391-844d-60f02aaaf78f
          --environment production
          --service web
          --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - name: Verify deployed revision
        env:
          HEALTH_URL: https://web-production-e18dd.up.railway.app/api/health
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: >-
          python3 scripts/verify_deployment.py
          --url "$HEALTH_URL"
          --expected-version "$EXPECTED_VERSION"
          --expected-revision "$GITHUB_SHA"
          --attempts 60
          --interval 5
          --stable-mismatch-limit 6
