name: Build Android Companion APK Fix4 22k Mono

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unpack Android Companion
        run: |
          rm -rf android-build
          mkdir -p android-build
          unzip -q rhythm-lab-android-companion-v0.4-mvp.zip -d android-build

      - name: Patch Android source for 22.05kHz mono WAV
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path(
              "android-build/android-companion/app/src/main/java/"
              "com/rhythmlab/companion"
          )

          # ---- RhythmApi.kt ----
          api = root / "RhythmApi.kt"
          s = api.read_text()

          s = s.replace(
              "import okhttp3.RequestBody.Companion.toRequestBody\n",
              ""
          )

          s = s.replace(
              "difficulty.lowercase().toRequestBody()",
              "difficulty.lowercase()"
          )

          s = s.replace(
              "seed.toString().toRequestBody()",
              "seed.toString()"
          )

          s = s.replace(
              '"audio/mp4".toMediaType()',
              '"audio/wav".toMediaType()'
          )

          api.write_text(s)

          # ---- YoutubeEngine.kt ----
          yt = root / "YoutubeEngine.kt"
          s = yt.read_text()

          s = s.replace(
              'addOption("-f", "bestaudio[ext=m4a]/bestaudio/best")',
              'addOption("-f", "bestaudio/best")'
          )

          s = s.replace(
              'addOption("--audio-format", "m4a")',
              'addOption("--audio-format", "wav")'
          )

          marker = '            addOption("--audio-format", "wav")'

          downsample = (
              '            addOption('
              '"--postprocessor-args", '
              '"ExtractAudio+ffmpeg_o:-ac 1 -ar 22050 -c:a pcm_s16le"'
              ')'
          )

          if downsample not in s:
              if marker not in s:
                  raise SystemExit("audio-format line not found")

              s = s.replace(
                  marker,
                  marker + "\n" + downsample
              )

          yt.write_text(s)
          PY

          echo "=== YoutubeEngine.kt ==="
          grep -n "bestaudio\|audio-format\|postprocessor-args" \
            android-build/android-companion/app/src/main/java/com/rhythmlab/companion/YoutubeEngine.kt

          echo "=== RhythmApi.kt ==="
          grep -n "audio/wav\|difficulty\|seed" \
            android-build/android-companion/app/src/main/java/com/rhythmlab/companion/RhythmApi.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)"

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: android-build/android-companion
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: rhythm-lab-companion-fix4-22k-mono
          path: android-build/android-companion/app/build/outputs/apk/debug/app-debug.apk
